name: Configuration checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.claude/**'
      - 'AGENTS.md'
      - 'scripts/**'
      - 'evals/golden/**'
      - 'DESIGN.md'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - run: python evals/golden/verify_cases.py
      - name: Dry-test exact airflow-69284 command contract
        shell: bash
        run: |
          python3 scripts/prepare_issue_input.py --case evals/golden/cases/69284/input.json --output /tmp/gh-aw/agent/case.json
          python3 scripts/search_duplicates.py --case /tmp/gh-aw/agent/case.json --corpus-root evals/golden/cases --output /tmp/gh-aw/agent/duplicates.json
          python3 scripts/validate_labels.py --case /tmp/gh-aw/agent/case.json --output /tmp/gh-aw/agent/validated.json --proposed-label kind:bug --proposed-label area:providers --proposed-label provider:openlineage
          python3 scripts/render_comment.py --case /tmp/gh-aw/agent/case.json --output /tmp/gh-aw/agent/comment.json --type none
          python3 scripts/validate_safe_outputs.py --input scripts/tests/fixtures/valid_agent_output.json
      - name: Enforce DESIGN line limit
        shell: bash
        run: test "$(wc -l < DESIGN.md)" -le 150
